[package]
name = "yaznot"
version = "1.0.0"
description = "YazNot — not alma ve yazma uygulaması"
authors = ["YazNot"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yaznot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
open = "5"
tokio = { version = "1", features = ["sync", "time"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
