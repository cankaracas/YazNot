name: Feature request
description: Suggest an improvement for YazNot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Where is this needed?
      options:
        - Both desktop and PWA
        - Windows desktop
        - PWA / mobile
        - Not sure
    validations:
      required: true
